#############################################################
## Step 1   约束backbone、Mg离子,优化水                    ##
#############################################################

# 		this simulation do a 3 steps minimization			#
#		step1 fix all non-water,minimize water				#


#------------------------------------------------------------------------------
#			ADJUSTABLE PARAMETERS
#------------------------------------------------------------------------------


amber                   on
parmfile                ./21.parm7
ambercoor               ./21.rst7
outputName              ./output/5-prod_b

set inputname           4-prod_a
binCoordinates          ./output/$inputname.restart.coor
binVelocities           ./output/$inputname.restart.vel
extendedSystem          ./output/$inputname.restart.xsc

set temperature		310

firsttimestep		0


#------------------------------------------------------------------------------
#			SIMULATION PARAMETERS
#------------------------------------------------------------------------------

#----- Water Parameters

wrapWater               on
wrapAll                 on
watermodel              tip4

#----- Force-Field Parameters

exclude                 scaled1-4
1-4scaling              0.833333
cutoff                  10.0
switching               off
switchdist              10.0
pairlistdist            13.5
scnb                    2.0
readexclusions          no
#LJcorrection            off
#ZeroMomentum            off

#----- Integrator Parameters

timestep                2.0  # 2fs/step
rigidBonds              all  # needed for 2fs steps
rigidTolerance          0.00001 # for Amber, 0.00000001 for Charmm
nonbondedFreq           1
fullElectFrequency      1
stepspercycle           10

#----- PME (for full-system periodic electrostatics)

PME                     yes
PMEGridSpacing          1.0

#--------------------  Constant T/P contrl, useless here --------------------------

# Constant Temperature Control

langevin		on	# do langevin dynamics
langevinDamping		1
langevinTemp		$temperature
langevinHydrogen	no    # don't couple langevin bath to hydrogens

# Constant Pressure Control (variable volume)

useGroupPressure	yes # needed for 2fs steps
useFlexibleCell		no  # no for water box, yes for membrane
useConstantArea		no  # no for water box, yes for membrane

langevinPiston		on
langevinPistonTarget	1.01325	#  1.01325 in bar -> 1 atm
#langevinPistonPeriod	100.0
#langevinPistonDecay	50.0
langevinPistonPeriod	200.0
langevinPistonDecay	100.0
langevinPistonTemp	$temperature

#----------------------------------------------------------------------------------

restartfreq		5000     # 500steps = every 1ps
dcdfreq			5000
xstFreq			5000
outputEnergies		5000
outputPressure		5000


#----- Fixed Atoms Constraint (set PDB beta-column to 1)

#fixedAtoms		no
#fixedAtomsForces	off
#fixedAtomsFile		./prep/4j5t_wat.pdb
#fixedAtomsCol		B

#----- (lipid and name P) or backbone or (segname B12 and noh)

#if {0} {
#constraints 		on
#consRef		con_IN_short_DNA_2MG_md_2.pdb # 2 kcal/mol, backbone and nucleic and (resid 316 to 320 329 to 333)
#consKFile		con_IN_short_DNA_2MG_md_2.pdb
#consKCol		B
#}

#margin			2.0


#------------------------------------------------------------------------------
#			EXTRA PARAMETERS
#------------------------------------------------------------------------------


#	Put here any custom parameters that are specific to 
#	this job (e.g., SMD, TclForces, etc...)


#------------------------------------------------------------------------------
#			EXECUTION SCRIPT
#------------------------------------------------------------------------------


#----- Production

run                  5000000

